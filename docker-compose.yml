services:
  iatreio-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iatreio
      POSTGRES_USER: iatreio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - iatreio-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iatreio -d iatreio"]
      interval: 5s
      timeout: 3s
      retries: 10

  iatreio-app:
    # 2026-10-12: χτίζεται στο GitHub (.github/workflows/deploy.yml), ΠΟΤΕ στον server:
    # `next build` εκεί γέμιζε τη μνήμη δίπλα στην Elasticsearch του fshome.
    # Τοπικά: `docker build -t ghcr.io/gfarma/iatreio:latest .` αν χρειαστεί.
    image: ghcr.io/gfarma/iatreio:latest
    container_name: iatreio-app
    # Το zd_swap (αλλαγή χωρίς διακοπή) περιμένει healthy πριν σβήσει το παλιό.
    # start_period: στην εκκίνηση τρέχουν db:migrate + db:seed πριν το next start.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://iatreio:${POSTGRES_PASSWORD}@iatreio-db:5432/iatreio
      AUTH_SECRET: ${AUTH_SECRET}
      ENABLE_AI_FEATURES: "false"
    depends_on:
      iatreio-db:
        condition: service_healthy
    networks:
      - default
      - web

networks:
  # Shared reverse-proxy network (fshome-nginx) — override per host via .env
  web:
    external: true
    name: ${PROXY_NETWORK:-fshome-elastic_elastic}

volumes:
  iatreio-db-data:
